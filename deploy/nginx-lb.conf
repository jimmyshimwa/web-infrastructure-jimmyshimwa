upstream weather {
    server 127.0.0.1:3001;   # web01
    server 127.0.0.1:3002;   # web02
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://weather;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}