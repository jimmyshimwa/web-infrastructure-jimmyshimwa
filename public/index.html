<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Hazard Planner</title>
    <link rel="stylesheet" href="style.css">
<body>
    <h1>Weather Hazard Planner</h1>

    <form id="search-form">
        <input id="city" type="text" placeholder="City or district" maxlength="50" aria-label="City">
        <button type="submit">Search</button>
    </form>

    <div id="quick"></div>
    <div id="matches"></div>

    <p id="message"></p>
    <div id = "alerts"></div>
    <section id="current"></section>
    <ul id="forecast"></ul>

    <footer>Served by: <span id="server">...</span></footer>
    <script src="app.js"></script>
</body>
</html>
