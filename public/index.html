<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Hazard Planner</title>
    <link rel="stylesheet" href="style.css">
    <p class="mission"> Early weather warnings to protext the livelihoods of African farmers and miners.</p>
</head>    
<body>
    <h1>Weather Hazard Planner</h1>

    <form id="search-form">
        <input id="city" type="text" placeholder="City or district" maxlength="50" aria-label="City">
        <button type="submit">Search</button>
    </form>

    <div id="quick"></div>
    <div id="matches"></div>

    <div id="controls">
        <label>I am a 
            <select id="user-type">
                <option value="farmer">Farmer</option>
                <option value="miner">Miner</option>
            </select>
        </label>
        <label> Sort by 
            <select id="sort">
                <option value="date">Date</option>
                <option value="hazard">Hazard level</option>
            </select>
        </label>
        <label >Show
            <select id="filter">
                <option value="all">All days</option>
                <option value="hazard">Hazard days only</option>
                <option value="2">Warnings only</option>
                <option value="1">Watches only</option>
            </select>
        </label>
    </div>

    <p id="message" role="alert"></p>
    <div id = "alerts"></div>
    <p id="second-opinion"></p>
    <section id="current"></section>
    <ul id="forecast"></ul>

    <footer>Served by: <span id="server">...</span>
    <p>
        <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Weather data by Open-Meteo.com</a>
        (CC BY 4.0) and
        <a href="https://openweathermap.org/" target="_blank" rel="noopener noreferrer">OpenWeather</a>
    </p>
    <p>Playing around with APIs by Jimmy Shimwa|C4</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
